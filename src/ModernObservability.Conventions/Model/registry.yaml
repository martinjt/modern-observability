groups:
  - id: registry.conference
    type: attribute_group
    display_name: "Attributes about the conference"
    brief: >
      Attributes relating to the conference
    attributes:
      - id: conference.brand
        type: string
        brief: >
          The brand organisting the conference
        note: >
          This is used to group conferences, and could also be a sub-brand
          It should not be the unique Id, but the name the conference uses
        examples: ["GOTO", "YOW!"]
        stability: stable
      - id: conference.name
        type: string
        brief: >
          The advertising name of the conference
        examples: ["GOTO CPH", "Unscripted Series"]
        stability: stable
